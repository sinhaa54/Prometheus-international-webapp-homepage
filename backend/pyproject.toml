[project]
name = "prometheus-homepage-backend"
version = "0.1.0"
description = "FastAPI backend for the Prometheus Homepage (Tableau dashboard portal)."
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
