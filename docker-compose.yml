version: "3.9"

services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      bash -lc "pip install --no-cache-dir -r requirements.txt &&
                uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: development
      DASHBOARD_REPOSITORY_MODE: local
      SUBMISSION_REPOSITORY_MODE: local
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ALLOWED_TABLEAU_HOSTS: tableau.pfizer.com,tableau-internal.pfizer.com
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -lc "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
